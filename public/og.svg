<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="1" stop-color="#0F1A2E"/>
    </linearGradient>
    <linearGradient id="emerald-grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#A7F3D0"/>
      <stop offset="0.5" stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#34D399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>
  <circle cx="900" cy="200" r="350" fill="url(#aurora)"/>
  <circle cx="200" cy="500" r="250" fill="url(#aurora)" opacity="0.5"/>

  <!-- Logo mark -->
  <g transform="translate(80, 80)">
    <rect width="72" height="72" rx="18" fill="#0F1A2E" stroke="url(#emerald-grad)" stroke-width="2"/>
    <path d="M52 22c-3 0-5.5 1.7-6.5 4C44 23 40 21 36 21c-6 0-11 5-11 11 0 11 16 17 20 22 3.5-4 19-12 19-23 0-4.7-3.8-8-8-8z" fill="url(#emerald-grad)"/>
  </g>
  <text x="172" y="115" font-family="Sora, sans-serif" font-size="32" font-weight="700" fill="#ECFDF5">Sage</text>
  <text x="172" y="143" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#6EE7B7" letter-spacing="0.5">by VirtuaLab Digital</text>

  <!-- Headline -->
  <text x="80" y="280" font-family="Sora, sans-serif" font-size="64" font-weight="800" fill="#ECFDF5" letter-spacing="-2">Stop selling dashboards.</text>
  <text x="80" y="360" font-family="Sora, sans-serif" font-size="64" font-weight="800" fill="url(#emerald-grad)" letter-spacing="-2">Start shipping rankings.</text>

  <!-- Sub -->
  <text x="80" y="420" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">AI-Visibility-first · agent-native SEO · BYOK · Cloudflare edge</text>

  <!-- Pills -->
  <g transform="translate(80, 470)">
    <rect width="180" height="42" rx="21" fill="#0F1A2E" stroke="url(#emerald-grad)" stroke-width="1"/>
    <text x="90" y="27" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6EE7B7">Google + Bing</text>
  </g>
  <g transform="translate(280, 470)">
    <rect width="160" height="42" rx="21" fill="#0F1A2E" stroke="url(#emerald-grad)" stroke-width="1"/>
    <text x="80" y="27" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6EE7B7">GEO · 5 AI engines</text>
  </g>
  <g transform="translate(460, 470)">
    <rect width="170" height="42" rx="21" fill="#0F1A2E" stroke="url(#emerald-grad)" stroke-width="1"/>
    <text x="85" y="27" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6EE7B7">MCP / Agent API</text>
  </g>
  <g transform="translate(650, 470)">
    <rect width="150" height="42" rx="21" fill="#0F1A2E" stroke="url(#emerald-grad)" stroke-width="1"/>
    <text x="75" y="27" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#6EE7B7">BYOK pricing</text>
  </g>
